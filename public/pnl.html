<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profit &amp; Loss · Pictureline</title>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <a class="brand" href="/">Pictureline <span>Cash Reports</span></a>
  <a class="crumb" id="backLink" href="/">← All reports</a>
  <div class="spacer"></div>
  <a class="crumb" href="/auth/logout">Sign out</a>
</div></div>

<div class="wrap">
  <h1 class="title">Profit &amp; Loss</h1>
  <p class="subtitle">Cash-verified · <span id="rangeLabel"></span></p>
  <div id="rangeBox"></div>
  <div class="banner" id="banner"></div>

  <div class="card" style="margin-top:22px">
    <div class="stmt" id="stmt"><div class="empty">Loading…</div></div>
    <div class="warnings" id="warnings"></div>
  </div>

  <div class="card">
    <h2>Inventory counts <span class="hint">— physical values (all locations); the statement uses the counts nearest your range</span></h2>
    <div class="range" style="margin-bottom:14px">
      <input type="date" id="icDate">
      <input type="text" id="icValue" placeholder="Total inventory value, e.g. 3264289.74" style="font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--hairline);border-radius:10px;padding:7px 11px;width:260px">
      <button class="btn primary" id="icSave">Save count</button>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>As of</th><th class="num">Value</th><th></th></tr></thead>
      <tbody id="icRows"></tbody>
    </table></div>
  </div>

  <div class="card">
    <h2>Operating expenses <span class="hint">— from the books (accrual), largest first</span></h2>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Expense</th><th class="num">Amount</th></tr></thead>
      <tbody id="expRows"></tbody>
    </table></div>
  </div>
</div>

<script src="/app.js"></script>
<script>
function row(label, value, cls) {
  const negClass = value < 0 ? ' neg' : '';
  return '<div class="srow' + (cls ? ' ' + cls : '') + '"><span>' + label + '</span><span class="num' + negClass + '">' + usd2.format(value) + '</span></div>';
}
async function load(force) {
  const fresh = staleGuard();
  setLoading(true);
  try {
    const d = await jfetch('/api/pnl-statement?' + Range.qs() + (force ? '&refresh=1' : ''));
    if (!fresh()) return;
    let h = '';
    h += '<div class="section">Income</div>';
    h += row('Money in — bank-verified customer cash', d.income.moneyIn);
    h += row('POS &amp; online deposits', d.income.deposits, 'sub');
    if (d.income.invoicePayments) h += row('Invoice payments (bank-landed)', d.income.invoicePayments, 'sub');
    if (d.income.refunds) h += row('Customer refunds', -d.income.refunds, 'sub');
    h += row('Less: sales tax remitted', -d.income.salesTaxRemitted);
    h += row('Total income (net revenue)', d.income.netRevenue, 'total');
    h += '<div class="section">Cost of goods sold</div>';
    h += row('Inventory purchases (cash, both locations)', d.cogs.inventoryCash);
    if (d.adjusted) {
      h += row('Less: inventory ' + (d.adjusted.inventoryChange >= 0 ? 'increase' : 'decrease') +
        ' (counts ' + d.adjusted.beginAsOf + ' → ' + d.adjusted.endAsOf + ')', -d.adjusted.inventoryChange, 'sub');
    }
    h += row('Freight, repairs &amp; materials', d.cogs.directCosts);
    h += row('Less: vendor rebates received', -d.cogs.rebateOffsets);
    if (d.adjusted) {
      h += row('Total COGS (accounting basis)', d.adjusted.cogsTotal, 'total');
      h += row('Gross profit' + (d.adjusted.grossMarginPct !== null ? ' — ' + d.adjusted.grossMarginPct.toFixed(1) + '%' : ''), d.adjusted.grossProfit, 'grand');
    } else {
      h += row('Total COGS (cash basis — no inventory counts for this range)', d.cogs.total, 'total');
      h += row('Gross profit' + (d.grossMarginPct !== null ? ' — ' + d.grossMarginPct.toFixed(1) + '%' : ''), d.grossProfit, 'grand');
    }
    h += '<div class="section">Expenses</div>';
    h += row('Operating expenses (books, accrual)', d.expenses.totalFromBooks);
    if (d.expenses.reimbursements) h += row('Less: reimbursements received', -d.expenses.reimbursements);
    h += row('Total expenses', d.expenses.net, 'total');
    h += row('Net operating income', d.adjusted ? d.adjusted.noi : d.noi, 'grand');
    $('stmt').innerHTML = h;
    const w = $('warnings');
    w.innerHTML = '';
    for (const warn of d.warnings || []) {
      const div = document.createElement('div');
      div.textContent = '⚠ ' + warn;
      w.appendChild(div);
    }
    const rows = $('expRows');
    rows.innerHTML = '';
    for (const e of d.expenses.rows || []) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + escapeHtml(e.name) + '</td><td class="num">' + usd2.format(e.amount) + '</td>';
      rows.appendChild(tr);
    }
    if (!(d.expenses.rows || []).length) rows.innerHTML = '<tr><td colspan="2" class="empty">Expense detail unavailable from the books report.</td></tr>';
  } catch (err) {
    if (err.message !== 'signed out') showBanner('<strong>Error.</strong> ' + escapeHtml(err.message));
  } finally {
    setLoading(false);
  }
  $('backLink').href = linkWithRange('/');
}
async function loadCounts() {
  try {
    const d = await jfetch('/api/inventory-counts');
    const rows = $('icRows');
    rows.innerHTML = '';
    for (const c of d.counts) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + c.asOf + '</td><td class="num">' + usd2.format(c.value) + '</td>' +
        '<td style="text-align:right"><button class="btn" data-del="' + c.asOf + '">Remove</button></td>';
      rows.appendChild(tr);
    }
    if (!d.counts.length) rows.innerHTML = '<tr><td colspan="3" class="empty">No counts yet — add month-end values above.</td></tr>';
    rows.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', async () => {
      if (!confirm('Remove the ' + b.dataset.del + ' count?')) return;
      await fetch('/api/inventory-counts?asOf=' + b.dataset.del, { method: 'DELETE' });
      loadCounts(); load(false);
    }));
  } catch (e) { /* non-fatal */ }
}

async function saveCount() {
  const asOf = $('icDate').value;
  const value = parseFloat($('icValue').value.replace(/[$,]/g, ''));
  if (!asOf || !Number.isFinite(value)) { alert('Enter a date and a value.'); return; }
  const res = await fetch('/api/inventory-counts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ asOf, value }),
  });
  if (!res.ok) { alert('Save failed'); return; }
  $('icValue').value = '';
  loadCounts();
  load(false);
}

async function init() {
  mountRange((force) => load(force));
  $('icSave').addEventListener('click', saveCount);
  if (await checkStatus()) { load(false); loadCounts(); }
}
init();
</script>
</body>
</html>
